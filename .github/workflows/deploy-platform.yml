name: Deploy platform API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s platform/app/tests
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: platform
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_SECRET_ARN: ${{ vars.DB_SECRET_ARN }}
      ACM_CERT_ARN: ${{ vars.ACM_CERT_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Build and push immutable image
        id: image
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build -t "${ECR_REPOSITORY_URL}:${tag}" platform/app
          docker push "${ECR_REPOSITORY_URL}:${tag}"
          repository_name="${ECR_REPOSITORY_URL#*/}"
          digest="$(aws ecr describe-images --repository-name "$repository_name" --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Deploy chart and verify
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          helm lint platform/chart
          tls_args=()
          if [[ -n "$ACM_CERT_ARN" ]]; then
            tls_args=(--set service.tls.enabled=true --set-string "service.tls.certificateArn=$ACM_CERT_ARN")
          fi
          helm upgrade --install platform-api platform/chart \
            --namespace platform \
            --wait --timeout 10m --rollback-on-failure --history-max 10 \
            --set-string "image.repository=$ECR_REPOSITORY_URL" \
            --set-string "image.digest=$IMAGE_DIGEST" \
            --set-string "app.awsRegion=$AWS_REGION" \
            --set-string "app.dbHost=$DB_HOST" \
            --set-string "app.dbSecretArn=$DB_SECRET_ARN" \
            "${tls_args[@]}"
          kubectl rollout status deployment/platform-api -n platform --timeout=10m
          helm test platform-api --namespace platform --logs --timeout 3m
          kubectl get service platform-api -n platform
