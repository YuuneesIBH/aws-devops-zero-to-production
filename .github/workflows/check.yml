name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
      - run: python3 -m unittest discover -s labs/01-local-api/tests
      - run: python3 -m unittest discover -s platform/app/tests
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: helm lint platform/chart
      - run: helm template platform-api platform/chart > /tmp/platform-rendered.yaml
      - run: git diff --check
